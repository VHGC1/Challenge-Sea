# docker compose up --build  →  API on http://localhost:8080, Swagger UI on /swagger-ui.html
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/challenge_sea
      DB_USER: sea
      DB_PASSWORD: sea
      ELASTICSEARCH_URIS: http://elasticsearch:9200
      # Local values only; set real ones outside this compose file
      JWT_SECRET: ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kdWN0aW9uLTMyYg==
      ADMIN_EMAIL: admin@sea.local
      ADMIN_PASSWORD: admin12345
    depends_on:
      postgres:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: challenge_sea
      POSTGRES_USER: sea
      POSTGRES_PASSWORD: sea
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sea -d challenge_sea"]
      interval: 5s
      retries: 20

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.18.8
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      # Dev only: without this, a host disk over 90% full keeps every shard unassigned
      cluster.routing.allocation.disk.threshold_enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      retries: 30

volumes:
  postgres-data:
  elasticsearch-data:
