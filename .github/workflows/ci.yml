name: CI

# Every PR and push to master: format, lint and unused dependencies, dependency audit, build and tests.

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, format and dead code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Repeated in .githooks/pre-commit on purpose: the hook formats before a commit,
      # CI catches commits that skipped it (--no-verify, hook not installed).
      - run: ./mvnw -B spotless:check
      # !cancelled(): report every check, not only the first one that fails
      - run: ./mvnw -B pmd:check
        if: ${{ !cancelled() }}
      # Unused and test-only dependencies; PMD only sees one file at a time
      - run: ./mvnw -B test-compile dependency:analyze-only
        if: ${{ !cancelled() }}

  audit:
    # Fails on any known vulnerability in the resolved dependency tree. A newly published advisory
    # can fail a PR that didn't touch dependencies: fix it with an upgrade or a version property /
    # <dependencyManagement> override in pom.xml.
    name: Dependency audit
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: v2.6.0
      OSV_SCANNER_SHA256: ca69b3d3cd08f889a49dc0a383122f71cc528b83803671df5fd874d97485b108
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # The SBOM lists what Maven actually resolves, which a scan of pom.xml alone would miss
      - run: ./mvnw -B cyclonedx:makeBom
      # Pinned binary with its checksum: Google's action may change behavior in a patch release
      - name: Install osv-scanner
        run: |
          curl -sSfL -o osv-scanner "https://github.com/google/osv-scanner/releases/download/$OSV_SCANNER_VERSION/osv-scanner_linux_amd64"
          echo "$OSV_SCANNER_SHA256  osv-scanner" | sha256sum -c -
          chmod +x osv-scanner
      # osv-scanner.toml lists the advisories skipped on purpose, each with its reason and expiry
      - run: ./osv-scanner scan source --config=osv-scanner.toml -L target/bom.json

  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      # Includes the self-check of the custom PMD rules (src/test/java/codequality/PmdRulesTest.java).
      # The integration test starts PostgreSQL and Elasticsearch with Testcontainers (Docker is on the runner).
      - run: ./mvnw -B verify
